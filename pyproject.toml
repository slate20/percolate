[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "percolate"
version = "0.1.0"
description = "A cozy, low-attention terminal coffee farm & roastery, built with Textual."
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60.0",
]

[project.optional-dependencies]
# patchelf pinned separately from the OS package: Alpine ships 0.18.0, which
# Nuitka hard-rejects as a known-buggy release on non-Debian/Fedora/SUSE
# distros; this PyPI build ships a working prebuilt musl binary instead.
build = ["nuitka[onefile]>=4.2", "patchelf>=0.19.1"]

[project.scripts]
percolate = "percolate.main:main"

[tool.hatch.build.targets.wheel]
packages = ["percolate"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py310"
# Nuitka writes real .py files into build/ (e.g. scons-debug.py) that aren't
# ours to lint.
extend-exclude = ["build", "dist"]

[tool.black]
target-version = ["py310"]
