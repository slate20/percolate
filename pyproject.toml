[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "percolate"
version = "0.1.0"
description = "A cozy, low-attention terminal coffee farm & roastery, built with Textual."
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]

[project.scripts]
percolate = "percolate.main:main"

[tool.hatch.build.targets.wheel]
packages = ["percolate"]
