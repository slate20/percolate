version: '3'

silent: true

tasks:
  build:
    desc: Standalone-Executable via PyInstaller bauen (nativ pro OS)
    vars:
      DISTPATH: dist/{{OS}}
    cmds:
      - uv sync --extra build
      - uv run pyinstaller percolate.spec --noconfirm --distpath {{.DISTPATH}} --workpath build/{{OS}}
      - tar -czf {{.DISTPATH}}/percolate-{{OS}}.tar.gz -C {{.DISTPATH}} percolate
      - echo "Packaged {{.DISTPATH}}/percolate-{{OS}}.tar.gz"

  install:
    desc: Binary nach ~/bin installieren
    deps: [build]
    cmds:
      - cp -r dist/{{OS}}/percolate/. "$HOME/bin/"
      - echo "Installed to $HOME/bin/percolate"

  lint:
    desc: ruff check ausführen
    cmds:
      - uv run ruff check .

  format:
    desc: black + ruff (import sort) anwenden
    cmds:
      - uv run black .
      - uv run ruff check --fix .
